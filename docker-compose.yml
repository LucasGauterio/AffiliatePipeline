version: '3.8'

services:
  python-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    environment:
      - ENV=development

  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./storefront:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
